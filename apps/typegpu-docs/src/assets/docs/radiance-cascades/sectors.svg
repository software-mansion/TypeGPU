<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 234" role="img" aria-labelledby="rc-sectors-title"><title id="rc-sectors-title">The four sectors of a pixel hold light arriving from +X, +Y, −X and −Y, each covering the quarter of directions centred on its axis</title><defs><marker id="rc-sectors-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="light" d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs><g transform="translate(110 0)"><polyline class="line" points="44,18 18,18 18,44"></polyline><polyline class="line" points="40,14 44,18 40,22"></polyline><polyline class="line" points="14,40 18,44 22,40"></polyline><text class="muted small" x="50" y="22">x</text><text class="muted small" x="14" y="58">y</text></g><circle class="surface" cx="240" cy="124" r="66"></circle><line class="guide" x1="248.485" y1="132.485" x2="286.669" y2="170.669"></line><line class="guide" x1="231.515" y1="132.485" x2="193.331" y2="170.669"></line><line class="guide" x1="231.515" y1="115.515" x2="193.331" y2="77.331"></line><line class="guide" x1="248.485" y1="115.515" x2="286.669" y2="77.331"></line><circle class="line" cx="240" cy="124" r="66"></circle><rect class="line" x="231" y="115" width="18" height="18"></rect><g><line class="light-stroke" x1="300" y1="124" x2="258" y2="124" marker-end="url(#rc-sectors-arrow)"></line><text class="text mono" x="316" y="118" text-anchor="start"> +X </text><text class="muted small" x="316" y="133" text-anchor="start"> layer 0 </text></g><g><line class="light-stroke" x1="240" y1="184" x2="240" y2="142" marker-end="url(#rc-sectors-arrow)"></line><text class="text mono" x="240" y="208" text-anchor="middle"> +Y </text><text class="muted small" x="240" y="223" text-anchor="middle"> layer 1 </text></g><g><line class="light-stroke" x1="180" y1="124" x2="222" y2="124" marker-end="url(#rc-sectors-arrow)"></line><text class="text mono" x="164" y="118" text-anchor="end"> −X </text><text class="muted small" x="164" y="133" text-anchor="end"> layer 2 </text></g><g><line class="light-stroke" x1="240" y1="64" x2="240" y2="106" marker-end="url(#rc-sectors-arrow)"></line><text class="text mono" x="240" y="24" text-anchor="middle"> −Y </text><text class="muted small" x="240" y="39" text-anchor="middle"> layer 3 </text></g></svg>
