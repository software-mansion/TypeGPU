<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 258" role="img" aria-labelledby="rc-ray-march-title"><title id="rc-ray-march-title">Sphere tracing one ray segment from startT to endT: each step moves by the distance to the nearest surface, until a sample lands within eps of an obstacle shrunk by bias</title><defs><marker id="rc-raymarch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="accent" d="M0 0 L8 4 L0 8 z"></path></marker></defs><g><circle class="guide" cx="129.6" cy="124.2" r="27"></circle><circle class="occluder" cx="129.6" cy="124.2" r="9"></circle></g><g><circle class="guide" cx="315" cy="64.8" r="54"></circle><circle class="light" cx="315" cy="64.8" r="36"></circle></g><circle class="accent-stroke" cx="315" cy="64.8" r="40.5" style="stroke-width: 1; stroke-dasharray: 2 2"></circle><g><line class="line" x1="335.941" y1="35.517" x2="346.411" y2="20.876" style="stroke-width: 1"></line><text class="muted small mono" x="350.411" y="20.876"> bias </text></g><g><line class="line" x1="354.693" y1="56.754" x2="382.037" y2="51.211" style="stroke-width: 1"></line><text class="muted small mono" x="386.037" y="51.211"> eps </text></g><circle class="line" cx="108" cy="90" r="31.45" style="stroke-width: 1"></circle><circle class="line" cx="139.45" cy="90" r="26.59" style="stroke-width: 1"></circle><circle class="line" cx="166.04" cy="90" r="40.975" style="stroke-width: 1"></circle><circle class="line" cx="207.015" cy="90" r="74.886" style="stroke-width: 1"></circle><circle class="line" cx="281.901" cy="90" r="5.6" style="stroke-width: 1"></circle><circle class="line" cx="287.501" cy="90" r="1.299" style="stroke-width: 1"></circle><line class="guide" x1="18" x2="108" y1="90" y2="90"></line><line class="accent-stroke" x1="108" x2="287.501" y1="90" y2="90"></line><line class="guide" x1="287.501" x2="396" y1="90" y2="90"></line><line class="accent-stroke" x1="404" x2="440" y1="90" y2="90" marker-end="url(#rc-raymarch-arrow)"></line><text class="muted small mono" x="404" y="80">direction</text><circle class="accent" cx="108" cy="90" r="3"></circle><circle class="accent" cx="139.45" cy="90" r="3"></circle><circle class="accent" cx="166.04" cy="90" r="3"></circle><circle class="accent" cx="207.015" cy="90" r="3"></circle><circle class="accent" cx="281.901" cy="90" r="3"></circle><circle class="accent" cx="287.501" cy="90" r="3"></circle><circle class="text" cx="18" cy="90" r="3.5"></circle><text class="muted small mono" x="12" y="112">origin</text><g><line class="line" x1="108" x2="108" y1="84" y2="58"></line><text class="muted small mono" x="108" y="52" text-anchor="middle"> startT </text></g><g><line class="line" x1="396" x2="396" y1="96" y2="102"></line><text class="muted small mono" x="396" y="116" text-anchor="middle"> endT </text></g><text class="text mono" x="16" y="206"> hit when sdf + bias ≤ eps </text><text class="text mono" x="16" y="226"> step = max((sdf + bias) × stepSafety, minStep) </text><text class="text mono" x="16" y="246"> stop past endT or after maxRaySteps steps </text></svg>
