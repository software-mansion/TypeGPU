rcle></g></g><g><text class="muted small" x="16" y="176"> 8 px </text><g><line class="light-stroke" x1="70" x2="163" y1="172" y2="172"></line><line class="light-stroke" x1="169" x2="262" y1="172" y2="172"></line><line class="line" x1="70" x2="70" y1="166" y2="178"></line><line class="line" x1="262" x2="262" y1="166" y2="178"></line><circle class="accent" cx="166" cy="172" r="4.5"></circle></g></g><g><text class="muted small" x="16" y="216"> 16 px </text><g><line class="light-stroke" x1="70" x2="259" y1="212" y2="212"></line><line class="light-stroke" x1="265" x2="454" y1="212" y2="212"></line><line class="line" x1="70" x2="70" y1="206" y2="218"></line><line class="line" x1="454" x2="454" y1="206" y2="218"></line><circle class="accent" cx="166" cy="212" r="2.5"></circle><circle class="accent" cx="262" cy="212" r="4.5"></circle><circle class="accent" cx="358" cy="212" r="2.5"></circle></g></g><text class="muted small" x="202" y="74"> reads every pixel it crosses </text><text class="muted small" x="286" y="176"> two 4 px intervals, joined </text><line class="guide" x1="16" x2="464" y1="140" y2="140"></line><text class="text mono" x="464" y="132" text-anchor="end"> tracedLevels: 3 </text></svg>
