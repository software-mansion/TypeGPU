<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 172" role="img" aria-labelledby="rc-scattering-title"><title id="rc-scattering-title">Three passes of run with a light, a patch of fog and a wall: the first pass has no incident light, so only direct light appears; in later passes the fog glows with the light that reached it in the previous pass and lights the corner behind the wall</title><defs><clipPath id="rc-scattering-clip"><rect width="136" height="104" rx="4"></rect></clipPath><radialGradient id="rc-scattering-direct" gradientUnits="userSpaceOnUse" cx="22" cy="24" r="120"><stop class="light-stop" offset="0" stop-opacity="0.8"></stop><stop class="light-stop" offset="0.3" stop-opacity="0.3"></stop><stop class="light-stop" offset="0.7" stop-opacity="0.05"></stop><stop class="light-stop" offset="1" stop-opacity="0"></stop></radialGradient><radialGradient id="rc-scattering-fog" gradientUnits="userSpaceOnUse" cx="100" cy="30" r="96"><stop class="light-stop" offset="0" stop-opacity="0.8"></stop><stop class="light-stop" offset="0.5" stop-opacity="0.3"></stop><stop class="light-stop" offset="1" stop-opacity="0"></stop></radialGradient></defs><g transform="translate(16 36)"><text class="text" y="-12"> pass 1 </text><text class="muted small" x="136" y="-12" text-anchor="end"> direct </text><rect class="surface" width="136" height="104" rx="4"></rect><g clip-path="url(#rc-scattering-clip)"><rect width="136" height="104" fill="url(#rc-scattering-direct)"></rect><path class="surface" d="M64 44L136 78.286V104H64Z"></path><rect width="136" height="104" fill="url(#rc-scattering-fog)" opacity="0"></rect><ellipse class="occluder" cx="100" cy="30" rx="24" ry="16" fill-opacity="0.35"></ellipse><ellipse class="light" cx="100" cy="30" rx="24" ry="16" fill-opacity="0"></ellipse><rect class="occluder" x="58" y="44" width="6" height="104"></rect></g><circle class="light" cx="22" cy="24" r="7"></circle><rect class="line" width="136" height="104" rx="4"></rect><text class="text mono small" y="124"> incident = 0 </text></g><g transform="translate(172 36)"><text class="text" y="-12"> pass 2 </text><text class="muted small" x="136" y="-12" text-anchor="end"> +1 bounce </text><rect class="surface" width="136" height="104" rx="4"></rect><g clip-path="url(#rc-scattering-clip)"><rect width="136" height="104" fill="url(#rc-scattering-direct)"></rect><path class="surface" d="M64 44L136 78.286V104H64Z"></path><rect width="136" height="104" fill="url(#rc-scattering-fog)" opacity="0.6"></rect><ellipse class="occluder" cx="100" cy="30" rx="24" ry="16" fill-opacity="0.14"></ellipse><ellipse class="light" cx="100" cy="30" rx="24" ry="16" fill-opacity="0.3"></ellipse><rect class="occluder" x="58" y="44" width="6" height="104"></rect></g><circle class="light" cx="22" cy="24" r="7"></circle><rect class="line" width="136" height="104" rx="4"></rect><text class="text mono small" y="124"> incident = pass 1 </text></g><g transform="translate(328 36)"><text class="text" y="-12"> pass 3 </text><text class="muted small" x="136" y="-12" text-anchor="end"> +2 bounces </text><rect class="surface" width="136" height="104" rx="4"></rect><g clip-path="url(#rc-scattering-clip)"><rect width="136" height="104" fill="url(#rc-scattering-direct)"></rect><path class="surface" d="M64 44L136 78.286V104H64Z"></path><rect width="136" height="104" fill="url(#rc-scattering-fog)" opacity="0.78"></rect><ellipse class="occluder" cx="100" cy="30" rx="24" ry="16" fill-opacity="0.077"></ellipse><ellipse class="light" cx="100" cy="30" rx="24" ry="16" fill-opacity="0.39"></ellipse><rect class="occluder" x="58" y="44" width="6" height="104"></rect></g><circle class="light" cx="22" cy="24" r="7"></circle><rect class="line" width="136" height="104" rx="4"></rect><text class="text mono small" y="124"> incident = pass 2 </text></g><path class="line" d="M160 83l5 5-5 5"></path><path class="line" d="M316 83l5 5-5 5"></path></svg>
