[project]
name = "depthart-pack"
version = "0.1.0"
description = "Strict offline exporter for the fixed DepthART 448 relative-depth models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "onnx>=1.17,<2"]

[project.scripts]
depthart-pack = "depthart_pack.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depthart_pack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
