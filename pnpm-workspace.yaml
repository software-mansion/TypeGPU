packages:
  - packages/*
  - apps/*

allowBuilds:
  '@rolldown/browser': true
  bun: true
  canvas: true
  esbuild: true
  msw: true
  protobufjs: false
  sharp: true
  webgpu: true

catalog:
  '@babel/types': ^7.29.0
  bun: 1.3.10
  arktype: ^2.1.22
  react: ^19.3.1
  react-dom: ^19.3.1

catalogs:
  build:
    jiti: ^2.6.0
    rollup: ^4.64.0
    tsdown: 0.15.12
    unbuild: ^3.5.0
  example:
    three: ^0.186.1
    wgpu-matrix: ^3.4.0
  frontend:
    fuse.js: ^7.1.0
    vite-imagetools: ^12.0.1
  test:
    vitest: &vitest ^4.1.12
    '@vitest/coverage-v8': ^4.1.12
    '@vitest/browser': ^4.1.12
    webgpu: ^0.6.2
  types:
    '@types/node': ^24.10.0
    '@types/three': ^0.181.0
    '@webgpu/types': ^0.1.71
    typescript: npm:tsover@^6.0.2

overrides:
  rollup: catalog:build
  vite: 8.1.6
  '@babel/types': 'catalog:'
  '@types/node': 'catalog:types'
  typescript: 'catalog:types'
  three: 'catalog:example'
  '@typescript-eslint/utils': ^8.57.2
  '@ungap/structured-clone': 1.3.1
  protobufjs: 7.6.6
  'oxfmt>tinypool': 2.2.0
  'monaco-editor>dompurify': ^3.4.17
  'query-string>decode-uri-component': ^0.5.1
  'speech-rule-engine>@xmldom/xmldom': ^0.9.12
  # starlight-blog@0.30 still declares @astrojs/mdx@^7, which expects Astro 6 peers
  'starlight-blog>@astrojs/mdx': ^8.0.3

patchedDependencies:
  comptime@0.1.0: 'patches/comptime@0.1.0.patch'
