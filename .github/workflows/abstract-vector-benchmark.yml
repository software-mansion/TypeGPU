name: Abstract vector benchmark

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to compare against'
        required: true
        default: 'main'

concurrency:
  group: abstract-vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr-branch
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          path: target-branch
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.base_ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pr-branch/pnpm-lock.yaml
            target-branch/pnpm-lock.yaml
      - name: Install dependencies (PR branch)
        working-directory: pr-branch
        run: pnpm install --frozen-lockfile
      - name: Install dependencies (target branch)
        working-directory: target-branch
        run: pnpm install --frozen-lockfile
      # Use the same harness for both revisions, even when the target predates it.
      - name: Benchmark target branch
        env:
          VECTOR_SOURCE_ROOT: ${{ github.workspace }}/target-branch
          VECTOR_OUTPUT: ${{ github.workspace }}/target-results.json
        run: node pr-branch/apps/infra-benchmarks/src/abstract-vectors/run.ts
      - name: Benchmark PR branch
        env:
          VECTOR_SOURCE_ROOT: ${{ github.workspace }}/pr-branch
          VECTOR_OUTPUT: ${{ github.workspace }}/pr-results.json
        run: node pr-branch/apps/infra-benchmarks/src/abstract-vectors/run.ts
      - name: Compare results
        run: |
          node pr-branch/apps/infra-benchmarks/src/abstract-vectors/report.ts \
            pr-results.json target-results.json > comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload samples and report
        uses: actions/upload-artifact@v4
        with:
          name: abstract-vector-benchmark
          path: |
            pr-results.json
            target-results.json
            comparison.md
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- abstract-vector-benchmark -->';
            const body = `${marker}\n${fs.readFileSync('comparison.md', 'utf8')}`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
